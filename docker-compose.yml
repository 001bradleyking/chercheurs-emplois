services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:80"
    environment:
      APP_NAME: "Chercheurs d'Emplois API"
      APP_ENV: local
      APP_KEY: "${APP_KEY:-base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}"
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: chercheurs_emplois
      DB_USERNAME: chercheurs
      DB_PASSWORD: "${DB_PASSWORD:-chercheurs-local}"
      CACHE_STORE: file
      SESSION_DRIVER: file
      FILESYSTEM_DISK: local
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "php artisan migrate --seed --force && apache2-foreground"
    volumes:
      - api_storage:/var/www/html/storage/app

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: chercheurs_emplois
      MYSQL_USER: chercheurs
      MYSQL_PASSWORD: "${DB_PASSWORD:-chercheurs-local}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-mysql-local-root}"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-mysql-local-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  api_storage:
